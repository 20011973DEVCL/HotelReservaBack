version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    command: sleep infinity

    network_mode: service:db

  db:
    image: postgres:14.3
    restart: unless-stopped
    container_name: hotelreserva-postgres

    environment:
      POSTGRES_PASSWORD: Danilo1973
      POSTGRES_USER: Danilo
      POSTGRES_DB: HotelReservas

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: